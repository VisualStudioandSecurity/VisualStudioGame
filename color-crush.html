<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Crush</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { 
      font-family: 'Fredoka', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    .cell {
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
      position: relative;
    }
    .cell:hover { transform: scale(1.12); z-index: 2; }
    .cell.pop {
      animation: pop 0.3s ease-out forwards;
    }
    @keyframes pop {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.5; }
      100% { transform: scale(0); opacity: 0; }
    }
    @keyframes fall {
      from { transform: translateY(-60px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .cell.fall { animation: fall 0.25s ease-out; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }
    .shake { animation: shake 0.3s; }
    @keyframes scoreFloat {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
    }
    .score-float {
      position: fixed; pointer-events: none; font-weight: 700; color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5); z-index: 100;
      animation: scoreFloat 0.8s ease-out forwards;
    }
    .combo-text {
      animation: comboFlash 0.5s ease-out;
    }
    @keyframes comboFlash {
      0% { transform: scale(2); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
    .pulse { animation: pulse 0.4s; }
    .grid-bg {
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    }
    .glow { box-shadow: 0 0 20px rgba(255,255,255,0.1), inset 0 1px 0 rgba(255,255,255,0.2); }
  </style>
</head>
<body class="grid-bg h-full">
  <div id="app" class="h-full flex flex-col items-center justify-center p-3 overflow-auto w-full">
    <!-- Header -->
    <div class="w-full max-w-md mb-3">
      <h1 id="title" class="text-3xl font-bold text-white text-center mb-2 drop-shadow-lg">🎯 Color Crush</h1>
      <p class="text-center text-sm text-purple-200 mb-3">Elimine grupos de 3+ blocos coloridos!</p>
      <div class="flex justify-between items-center bg-white/10 backdrop-blur rounded-xl px-4 py-2 glow">
        <div class="text-center">
          <div class="text-xs text-purple-300 uppercase tracking-wider">Pontos</div>
          <div id="score" class="text-2xl font-bold text-white">0</div>
        </div>
        <div class="text-center">
          <div class="text-xs text-purple-300 uppercase tracking-wider">Combo</div>
          <div id="combo" class="text-2xl font-bold text-yellow-300">x1</div>
        </div>
        <div class="text-center">
          <div class="text-xs text-purple-300 uppercase tracking-wider">Recorde</div>
          <div id="best" class="text-2xl font-bold text-emerald-300">0</div>
        </div>
        <div class="text-center">
          <div class="text-xs text-purple-300 uppercase tracking-wider">Jogadas</div>
          <div id="moves" class="text-2xl font-bold text-rose-300">30</div>
        </div>
      </div>
    </div>

    <!-- Game Grid -->
    <div id="grid" class="grid gap-1 w-full max-w-md" style="grid-template-columns: repeat(8, 1fr);"></div>

    <!-- Restart -->
    <button id="restartBtn" class="mt-3 bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-6 rounded-xl transition-colors shadow-lg">
      <i data-lucide="refresh-cw" style="width:16px;height:16px;display:inline-block;vertical-align:middle;margin-right:4px;"></i> Reiniciar
    </button>

    <!-- Game Over Overlay -->
    <div id="gameOver" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
      <div class="bg-gradient-to-br from-purple-900 to-indigo-900 rounded-2xl p-8 text-center max-w-xs mx-4 glow">
        <h2 class="text-3xl font-bold text-white mb-2">Fim de Jogo!</h2>
        <p class="text-purple-200 mb-1">Sua pontuação:</p>
        <div id="finalScore" class="text-5xl font-bold text-yellow-300 mb-4">0</div>
        <p id="newRecord" class="hidden text-emerald-300 font-bold mb-4 text-lg">🏆 Novo Recorde!</p>
        <button id="playAgain" class="bg-yellow-400 hover:bg-yellow-300 text-purple-900 font-bold py-3 px-8 rounded-xl transition-colors text-lg shadow-lg">
          Jogar Novamente
        </button>
      </div>
    </div>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#eab308', '#a855f7', '#f97316'];
    const ROWS = 8;
    const COLS = 8;
    const MAX_MOVES = 30;

    let board = [];
    let score = 0;
    let combo = 1;
    let movesLeft = MAX_MOVES;
    let highScore = parseInt(localStorage.getItem('colorcrush_best') || '0', 10);
    let isBusy = false;

    const gridEl = document.getElementById('grid');
    const scoreEl = document.getElementById('score');
    const comboEl = document.getElementById('combo');
    const bestEl = document.getElementById('best');
    const movesEl = document.getElementById('moves');
    const gameOverEl = document.getElementById('gameOver');
    const finalScoreEl = document.getElementById('finalScore');
    const newRecordEl = document.getElementById('newRecord');
    const restartBtn = document.getElementById('restartBtn');
    const playAgainBtn = document.getElementById('playAgain');
    const titleEl = document.getElementById('title');

    bestEl.textContent = highScore;

    function getRandomColor() {
      return COLORS[Math.floor(Math.random() * COLORS.length)];
    }

    function initBoardData() {
      board = [];
      for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        for (let c = 0; c < COLS; c++) {
          board[r][c] = getRandomColor();
        }
      }
    }

    function renderGrid() {
      gridEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.style.backgroundColor = board[r][c];
          cell.style.aspectRatio = '1';
          cell.style.boxShadow = 'inset 0 2px 4px rgba(255,255,255,0.3), inset 0 -2px 4px rgba(0,0,0,0.2)';
          cell.dataset.r = r;
          cell.dataset.c = c;
          cell.addEventListener('click', () => handleCellClick(r, c));
          gridEl.appendChild(cell);
        }
      }
    }

    function getConnectedGroup(r, c, color, visited = new Set()) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return [];
      const key = `${r},${c}`;
      if (visited.has(key)) return [];
      if (board[r][c] !== color) return [];

      visited.add(key);
      let group = [{ r, c }];

      group = group.concat(getConnectedGroup(r - 1, c, color, visited));
      group = group.concat(getConnectedGroup(r + 1, c, color, visited));
      group = group.concat(getConnectedGroup(r, c - 1, color, visited));
      group = group.concat(getConnectedGroup(r, c + 1, color, visited));

      return group;
    }

    function showFloatingScore(points, r, c) {
      const index = r * COLS + c;
      const cellEl = gridEl.children[index];
      if (!cellEl) return;

      const rect = cellEl.getBoundingClientRect();
      const floatEl = document.createElement('div');
      floatEl.className = 'score-float';
      floatEl.textContent = `+${points}`;
      floatEl.style.left = `${rect.left + rect.width / 2 - 20}px`;
      floatEl.style.top = `${rect.top}px`;
      floatEl.style.fontSize = points > 50 ? '28px' : '20px';
      document.body.appendChild(floatEl);

      setTimeout(() => floatEl.remove(), 800);
    }

    async function handleCellClick(r, c) {
      if (isBusy || movesLeft <= 0) return;

      const color = board[r][c];
      if (!color) return;

      const group = getConnectedGroup(r, c, color, new Set());

      if (group.length < 3) {
        const index = r * COLS + c;
        const cellEl = gridEl.children[index];
        if (cellEl) {
          cellEl.classList.add('shake');
          setTimeout(() => cellEl.classList.remove('shake'), 300);
        }
        return;
      }

      isBusy = true;
      movesLeft--;
      movesEl.textContent = movesLeft;

      if (group.length >= 5) {
        combo++;
        comboEl.textContent = `x${combo}`;
        comboEl.classList.remove('combo-text');
        void comboEl.offsetWidth;
        comboEl.classList.add('combo-text');
      } else {
        combo = 1;
        comboEl.textContent = 'x1';
      }

      const points = group.length * 10 * combo;
      score += points;
      scoreEl.textContent = score;
      scoreEl.parentElement.classList.add('pulse');
      setTimeout(() => scoreEl.parentElement.classList.remove('pulse'), 400);

      const centerCell = group[Math.floor(group.length / 2)];
      showFloatingScore(points, centerCell.r, centerCell.c);

      group.forEach(({ r: gr, c: gc }) => {
        const idx = gr * COLS + gc;
        if (gridEl.children[idx]) {
          gridEl.children[idx].classList.add('pop');
        }
      });

      await new Promise(res => setTimeout(res, 300));

      group.forEach(({ r: gr, c: gc }) => {
        board[gr][gc] = null;
      });

      for (let cCol = 0; cCol < COLS; cCol++) {
        let emptyRows = [];
        for (let rRow = ROWS - 1; rRow >= 0; rRow--) {
          if (board[rRow][cCol] !== null) {
            if (emptyRows.length > 0) {
              board[emptyRows[0]][cCol] = board[rRow][cCol];
              board[rRow][cCol] = null;
              emptyRows.shift();
              emptyRows.push(rRow);
            }
          } else {
            emptyRows.push(rRow);
          }
        }
        for (const emptyR of emptyRows) {
          board[emptyR][cCol] = getRandomColor();
        }
      }

      await new Promise(res => setTimeout(res, 260));

      renderGrid();

      gridEl.querySelectorAll('.cell').forEach(cell => {
        cell.classList.add('fall');
        setTimeout(() => cell.classList.remove('fall'), 250);
      });

      await new Promise(res => setTimeout(res, 260));

      isBusy = false;

      if (movesLeft <= 0) {
        setTimeout(endGame, 300);
      }
    }

    function endGame() {
      finalScoreEl.textContent = score;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('colorcrush_best', highScore);
        bestEl.textContent = highScore;
        newRecordEl.classList.remove('hidden');
      } else {
        newRecordEl.classList.add('hidden');
      }
      gameOverEl.classList.remove('hidden');
    }

    function resetGame() {
      score = 0;
      combo = 1;
      movesLeft = MAX_MOVES;
      isBusy = false;
      scoreEl.textContent = '0';
      comboEl.textContent = 'x1';
      movesEl.textContent = MAX_MOVES;
      gameOverEl.classList.add('hidden');
      initBoardData();
      renderGrid();
    }

    restartBtn.addEventListener('click', resetGame);
    playAgainBtn.addEventListener('click', resetGame);

    resetGame();

    if (window.lucide) {
      window.lucide.createIcons();
    }

    const defaultConfig = {
      title_text: '🎯 Color Crush',
      background_color: '#302b63',
      text_color: '#ffffff',
      accent_color: '#a855f7',
      surface_color: '#1a1640',
      action_color: '#eab308'
    };

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => {
          const titleText = config.title_text || defaultConfig.title_text;
          if (titleEl) titleEl.textContent = titleText;
          document.body.style.background = `linear-gradient(135deg, #0f0c29 0%, ${config.background_color || defaultConfig.background_color} 50%, #24243e 100%)`;
          if (restartBtn) restartBtn.style.backgroundColor = config.accent_color || defaultConfig.accent_color;
          if (comboEl) comboEl.style.color = config.action_color || defaultConfig.action_color;
        },
        mapToCapabilities: (config) => ({
          recolorables: [
            { get: () => config.background_color || defaultConfig.background_color, set: (val) => { config.background_color = val; window.elementSdk.setConfig({ background_color: val }); } },
            { get: () => config.surface_color || defaultConfig.surface_color, set: (val) => { config.surface_color = val; window.elementSdk.setConfig({ surface_color: val }); } },
            { get: () => config.text_color || defaultConfig.text_color, set: (val) => { config.text_color = val; window.elementSdk.setConfig({ text_color: val }); } },
            { get: () => config.accent_color || defaultConfig.accent_color, set: (val) => { config.accent_color = val; window.elementSdk.setConfig({ accent_color: val }); } },
            { get: () => config.action_color || defaultConfig.action_color, set: (val) => { config.action_color = val; window.elementSdk.setConfig({ action_color: val }); } }
          ],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([['title_text', config.title_text || defaultConfig.title_text]])
      });
    }

    document.addEventListener('copy', (e) => e.preventDefault());
    document.addEventListener('cut', (e) => e.preventDefault());
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('dragstart', (e) => e.preventDefault());
    document.addEventListener('selectstart', (e) => e.preventDefault());
  });
  </script>
</body>
</html>
